[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinity-bot"
version = "0.1.0"
description = "INFINITY BOT — local autonomous coding agent built around the original INFINITY HYPER 5.5 neural core"
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
studio = ["fastapi>=0.110", "uvicorn>=0.30", "websockets>=12"]

[project.scripts]
infinity = "infinity.cli:main"

[tool.setuptools.packages.find]
include = ["infinity*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
